<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · Cozelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f4e8d3;--sand:#ecd8bd;--copper:#b5693f;--copper-d:#8e4a2a;--rose:#d49a78;--cocoa:#4a2b1b;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;
  --glass:rgba(250,245,235,.9);--line:rgba(181,105,63,.45);--bg-image:none
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100%;display:grid;place-items:center;padding:clamp(14px,4vw,48px);
  font-family:var(--sans);font-weight:300;color:var(--cocoa);background:#d8c2a3;
  -webkit-font-smoothing:antialiased
}
body::before{content:"";position:fixed;inset:-16px;z-index:-1;background:var(--bg-image) center/cover;filter:blur(2.5px)}
a{color:inherit;text-decoration:none}

.panel{
  width:100%;max-width:880px;overflow:hidden;
  padding:clamp(22px,5vw,56px) clamp(22px,6vw,72px) clamp(28px,5vw,60px);
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:28px
}

.brand{display:inline-flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.22em;color:var(--copper-d)}
.brand img{width:38px;height:38px;object-fit:contain}
.brand img[src=""]{display:none}

.num{
  margin-top:clamp(28px,6vw,56px);
  font-family:var(--serif);font-weight:500;font-variant-numeric:lining-nums;
  font-size:clamp(104px,27vw,240px);line-height:.9;letter-spacing:.02em;color:var(--copper-d);
  white-space:nowrap;padding-bottom:.3em
}
.ball{display:inline-block;width:.62em;height:.62em;margin:0 .05em;vertical-align:baseline;overflow:visible}
.ball .body{fill:var(--copper)}
.ball .strand{fill:none;stroke:var(--cream);stroke-opacity:.5;stroke-width:2.2;stroke-linecap:round}
.ball .rim{fill:none;stroke:var(--copper-d);stroke-width:1.6}
.ball .thread{
  fill:none;stroke:var(--copper);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:0;
  animation:draw 1.8s cubic-bezier(.45,.05,.3,1) .35s backwards
}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

h1{
  margin-top:clamp(6px,1.5vw,14px);
  font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,52px);line-height:1.08;color:var(--cocoa)
}
.msg{margin-top:14px;max-width:46ch;font-size:17px;line-height:1.65}
.msg + .msg{margin-top:8px}
#path{font-weight:500;color:var(--copper-d);overflow-wrap:anywhere}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(24px,4vw,36px)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;
  border-radius:30px;border:1px solid var(--copper);font-size:14px;font-weight:500;letter-spacing:.08em;
  transition:background-color .2s,color .2s
}
.btn.main{background:var(--copper);color:var(--cream)}
.btn.main:hover{background:var(--copper-d);border-color:var(--copper-d)}
.btn.alt{color:var(--copper-d)}
.btn.alt:hover{background:var(--copper);color:var(--cream)}
a:focus-visible{outline:3px solid var(--cocoa);outline-offset:3px}

@media (max-width:480px){
  .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  .ball .thread{animation:none}
}
</style>
</head>
<body>
<main class="panel">
  <a class="brand" id="brand" href="/" aria-label="Cozelle home">
    <img id="logo" alt="" src="">
    <span>COZELLE</span>
  </a>

  <div class="num" aria-hidden="true">4<svg class="ball" viewBox="0 0 100 100" focusable="false">
    <defs><clipPath id="ballClip"><circle cx="50" cy="50" r="46"/></clipPath></defs>
    <circle class="body" cx="50" cy="50" r="46"/>
    <g class="strand-group" clip-path="url(#ballClip)">
      <path class="strand" d="M-4 74 C 26 58, 56 30, 104 14"/>
      <path class="strand" d="M-4 94 C 30 76, 66 46, 104 30"/>
      <path class="strand" d="M10 106 C 40 90, 78 62, 108 48"/>
      <path class="strand" d="M-4 52 C 22 40, 46 22, 80 -4"/>
      <path class="strand" d="M6 22 C 30 40, 56 62, 70 108"/>
      <path class="strand" d="M30 6 C 52 28, 78 50, 96 84"/>
      <path class="strand" d="M-4 44 C 20 58, 36 80, 44 108"/>
    </g>
    <circle class="rim" cx="50" cy="50" r="46"/>
    <path class="thread" pathLength="1" d="M82 82 C 96 112, 74 130, 112 128 S 172 110, 204 124 S 256 142, 288 120 C 304 109, 320 124, 310 138 C 302 149, 284 142, 291 131"/>
  </svg>4</div>

  <h1>Page not found</h1>
  <p class="msg">There is no page at <span id="path">this address</span>. The link may be out of date, or the address may have a typo.</p>
  <p class="msg">Head back to the shop to keep browsing.</p>

  <div class="actions">
    <a class="btn main" id="home" href="/">Go to the shop</a>
    <a class="btn alt" id="shop" href="/collection">Browse the collection</a>
  </div>
</main>

<script>
(function () {
  var SITE_ROOT = '/';

  var root = SITE_ROOT.charAt(SITE_ROOT.length - 1) === '/' ? SITE_ROOT : SITE_ROOT + '/';

  document.getElementById('brand').href = root;
  document.getElementById('home').href = root;
  document.getElementById('shop').href = root + 'collection';

  var logo = root + 'assets/img/cozelle-logo.png';
  document.getElementById('logo').src = logo;

  var icon = document.createElement('link');
  icon.rel = 'icon';
  icon.type = 'image/png';
  icon.href = logo;
  document.head.appendChild(icon);

  document.documentElement.style.setProperty('--bg-image', 'url("' + root + 'assets/img/cozelle-bg.jpg")');

  var path = location.pathname + location.search;
  if (path && path !== '/') {
    document.getElementById('path').textContent = path;
  }
})();
</script>
</body>
</html>
