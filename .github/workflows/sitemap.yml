name: Update sitemap
on:
  schedule: [{ cron: '0 */6 * * *' }]   # every 6 hours
  workflow_dispatch: {}                  # or run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build sitemap from live Firestore products
        run: node "$(find . -path '*tools/generate-sitemap.js' -not -path './node_modules/*' | head -1)" https://cozelleyarn.shop
      - name: Commit if changed
        run: |
          git config user.name "sitemap-bot"
          git config user.email "sitemap-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update sitemap" && git push)
