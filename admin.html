<style>

*{box-sizing:border-box;margin:0}
body{font:14.5px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink)}
[hidden]{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#faf6ef,#f1e7d6)}
.card{background:#fff;border-radius:24px;padding:36px;width:min(390px,92vw);display:grid;gap:12px;box-shadow:0 30px 70px -44px rgba(74,43,27,.55)}
.card h1{font:500 30px Georgia,serif;color:var(--cocoa)}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--copper);outline-offset:1px}

button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:rgba(74,43,27,.07);color:var(--cocoa);transition:.15s}

#nav>button:hover{background:rgba(255,255,255,.09)}#nav>button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--copper)}
#nav em{margin-left:auto;background:var(--copper);color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:20px;padding:0 8px}
.nf{margin-top:auto;display:grid;gap:6px;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.14)}.nf span{color:#e9d9c0;opacity:.7;font-size:12px;word-break:break-all;padding:0 8px}

main{padding:0 30px 80px;max-width:1240px;width:100%}
.bar{position:sticky;top:0;z-index:5;background:rgba(250,246,239,.93);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px;flex-wrap:wrap;border-bottom:1px solid transparent}

.box h3 button{text-transform:none;letter-spacing:0;font-weight:400}
label.f{display:grid;gap:5px}label.f>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lab)}
label.chk{display:flex;align-items:center;gap:10px}label.chk>span{font-size:14px;letter-spacing:0;text-transform:none;color:inherit}
details.it{border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--cream)}details.it[open]{background:#fff;box-shadow:0 10px 30px -24px rgba(74,43,27,.6)}

.sl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}.sl .th{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--sand);flex:none}
.sm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:400;color:var(--mut)}.sm s{opacity:.7}.sm b{color:var(--cocoa)}
.in{display:grid;gap:14px;padding:4px 0 16px}.ctl{display:flex;gap:4px}.ctl button{padding:4px 10px}
.img{display:flex;gap:10px;align-items:center}.img img{width:54px;height:54px;object-fit:cover;border-radius:10px;background:var(--sand);flex:none}
.up{position:relative;flex:none}.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mut{color:var(--mut)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input,.row select{width:auto;flex:1;min-width:130px}

.kpi strong{display:block;font:500 28px Georgia,serif;color:var(--cocoa);margin:4px 0 2px}.kpi span{font-size:12px;color:var(--mut)}
.kpi:first-child{background:var(--cocoa);border-color:var(--cocoa)}.kpi:first-child small,.kpi:first-child span{color:#d9c6aa}.kpi:first-child strong{color:#fff}
.kpi.hot strong{color:var(--copper)}

.alert button{background:var(--copper);color:#fff}.alert button:hover{background:var(--copper-d)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lab);padding:6px 8px}td{padding:10px 8px;border-top:1px solid var(--line)}tr[data-goto]{cursor:pointer}tr[data-goto]:hover{background:var(--cream)}td.r,th.r{text-align:right}

.product-catalog{display:grid;gap:16px;margin-top:18px}

.catalog-actions{display:flex;gap:10px;align-items:center}.catalog-actions .pri{padding:11px 17px}
.catalog-search{max-width:460px}

.catalog-product-info{display:grid;gap:4px;min-width:0}.catalog-product-name{font-size:15px;color:var(--cocoa);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.catalog-empty{grid-column:1/-1;padding:44px 24px;text-align:center;background:#fff;border:1px dashed rgba(74,43,27,.2);border-radius:18px;color:var(--mut)}
.product-tools{margin-top:8px}.product-tools summary{font-weight:600;color:var(--cocoa);padding:0}.product-tools[open] summary{margin-bottom:10px}
.product-dialog-backdrop{position:fixed;inset:0;z-index:40;background:rgba(35,24,18,.48);display:grid;place-items:center;padding:18px}

.product-editor-top{display:flex;align-items:center;gap:14px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line)}
.product-editor-top .back{flex:none;padding:10px 13px}.product-editor-top small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lab)}
.product-editor-top h2{font:500 25px Georgia,serif;color:var(--cocoa);overflow-wrap:anywhere}.product-editor-top p{font-size:12px;color:var(--mut);margin-top:3px}.product-editor-top .tag{margin-left:auto}
.product-editor-layout{height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 250px;align-items:start;gap:14px;padding:16px}
.product-editor-main{display:grid;gap:12px;min-width:0}
.product-section{display:grid;gap:14px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:16px}
.product-section-head h3{font:600 14px system-ui;color:var(--cocoa)}
.product-section-head p{margin-top:3px;font-size:12px;color:var(--mut)}
.product-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.product-info-fields .f:nth-child(3),.product-media-fields .img{grid-column:1/-1}
.product-fields .img{min-width:0}
.product-optional{padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
.product-optional summary{padding:0;color:var(--cocoa);font-weight:600}.product-optional[open] summary{padding-bottom:12px}
.product-optional .blk{padding:0;margin:0;border:0;background:transparent}.product-optional .blk h3{font-size:11px}
.product-preview{position:sticky;top:0;display:grid;gap:10px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px}
.product-preview h3{font:500 21px Georgia,serif;color:var(--cocoa)}.product-preview .preview-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--sand)}
.product-preview .preview-category{font-size:11px;color:var(--lab);text-transform:uppercase;letter-spacing:.12em}
.product-preview .preview-price{font-size:16px;color:var(--copper-d)}.product-preview .preview-note{font-size:11px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px}
.product-editor-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-top:1px solid var(--line)}
.product-editor-footer p{font-size:11px;color:var(--mut)}.product-editor-footer>div{display:flex;gap:8px}
@media(max-width:1050px){.product-editor-layout{grid-template-columns:minmax(0,1fr) 220px}}
@media(max-width:760px){#app{grid-template-columns:minmax(0,1fr)}#nav{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;gap:2px}#nav h2{display:none}#nav>button{flex:none;white-space:nowrap;padding:9px 11px;font-size:12px}.nf{margin:0 0 0 auto;display:flex;flex:none;gap:5px;padding:0 0 0 8px;border:0}.nf span{display:none}.nf button{white-space:nowrap;padding:8px 10px;font-size:11px}main{padding:0 14px 60px;max-width:none}.bar{top:50px;padding:12px 0}.bar h1{font-size:23px}.bar div{gap:6px}.bar a,.bar button{font-size:12px}.catalog-heading h2{font-size:25px}.catalog-actions{width:100%}.catalog-actions .catalog-search{flex:1;min-width:0}.catalog-product{grid-template-columns:54px minmax(0,1fr) auto;gap:10px;padding:10px}.catalog-product-thumb{width:54px;height:58px}.catalog-product-actions{gap:2px}.catalog-product-actions button{padding:7px}.catalog-product .edit{padding:8px 10px}.product-dialog-backdrop{padding:0}.product-dialog{width:100%;height:100vh;height:100dvh;border-radius:0;border:0}.product-editor-top{align-items:flex-start;flex-wrap:wrap;padding:12px 14px}.product-editor-top .back{padding:8px 10px}.product-editor-top>div{flex:1;min-width:140px}.product-editor-top h2{font-size:21px}.product-editor-top>.tag{margin-left:0}.product-editor-layout{display:flex;flex-direction:column;gap:12px;padding:12px;min-height:0}.product-editor-main{width:100%}.product-fields{grid-template-columns:1fr}.product-info-fields .f:nth-child(3),.product-media-fields .img{grid-column:auto}.product-section{padding:14px}.product-preview{display:none}.product-editor-footer{padding:10px 12px}.product-editor-footer p{max-width:36%;line-height:1.3}.product-editor-footer>div{flex:1}.product-editor-footer button{flex:1;padding:10px 8px;font-size:12px}}

async function changeOrderStatus(id,status){
 const orderRef=db.collection('orders').doc(id);let stockChanges={};
 await db.runTransaction(async tx=>{
  const snap=await tx.get(orderRef);if(!snap.exists)throw new Error('This order no longer exists.');
  const o=snap.data(),deduct=SALE(status)&&!o.stockDeducted,restore=status==='cancelled'&&!!o.stockDeducted;
  stockChanges={};const qty={};
  if(deduct||restore)for(const item of o.items||[]){const n=Number(item.qty)||0;if(item.id&&n>0)qty[item.id]=(qty[item.id]||0)+n}
  const ids=Object.keys(qty),refs=ids.map(pid=>db.collection('products').doc(pid)),products=await Promise.all(refs.map(ref=>tx.get(ref)));
  const writes=[];
  products.forEach((p,i)=>{if(!p.exists)return;const data=p.data();if(!Stock.tracked(data))return;const old=Stock.count(data),next=restore?old+qty[ids[i]]:old-qty[ids[i]];
   if(deduct&&next<0)throw new Error(`Not enough stock for ${data.name||ids[i]}. Add stock before confirming this order.`);
   stockChanges[ids[i]]=next;writes.push([refs[i],next]);
  });
  writes.forEach(([ref,stock])=>tx.update(ref,{stock}));
  const update={status};if(deduct)update.stockDeducted=true;if(restore)update.stockDeducted=false;
  tx.update(orderRef,update);

}

 const lab=x=>monthly?new Date(+x.slice(0,4),+x.slice(5,7)-1,1).toLocaleDateString('en-IN',{month:'short',year:'2-digit'}):new Date(+x.slice(0,4),+x.slice(5,7)-1,+x.slice(8)).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
 const base={responsive:true,maintainAspectRatio:false};
 mk('c1',{type:'bar',data:{labels:keys.map(lab),datasets:[{label:'Sales',data:keys.map(x=>rv[x]||0),backgroundColor:'#b5693f',borderRadius:6,yAxisID:'y'},{type:'line',label:'Orders',data:keys.map(x=>ct[x]||0),borderColor:'#4a2b1b',backgroundColor:'#4a2b1b',tension:.3,pointRadius:2,yAxisID:'y1'}]},
  options:{...base,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label==='Sales'?' Sales '+inr(c.parsed.y):' Orders '+c.parsed.y}}},scales:{x:{ticks:{maxTicksLimit:10}},y:{beginAtZero:true,ticks:{callback:v=>inr(v)}},y1:{position:'right',beginAtZero:true,grid:{drawOnChartArea:false},ticks:{precision:0}}}}});
 const sc=ST.map(s=>inR.filter(o=>o.status===s).length);
 mk('c2',{type:'doughnut',data:{labels:ST.map(s=>STL[s]),datasets:[{data:sc,backgroundColor:ST.map(s=>SC[s]),borderWidth:0}]},options:{...base,cutout:'62%',plugins:{legend:{position:'bottom'}}}});
 const byP={},byC={},cat=id=>((state.products||[]).find(p=>p.id===id)||{}).category||'Other';
 sales.forEach(o=>(o.items||[]).forEach(i=>{const r=(+i.price||0)*(+i.qty||0);byP[i.name]=(byP[i.name]||0)+r;const c=cat(i.id);byC[c]=(byC[c]||0)+r}));
 const tp=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,6),tc=Object.entries(byC).sort((a,b)=>b[1]-a[1]);
 mk('c3',{type:'bar',data:{labels:tp.map(x=>x[0]),datasets:[{data:tp.map(x=>x[1]),backgroundColor:'#4a2b1b',borderRadius:6}]},options:{...base,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+inr(c.parsed.x)}}},scales:{x:{beginAtZero:true,ticks:{callback:v=>inr(v)}}}}});
 mk('c4',{type:'doughnut',data:{labels:tc.map(x=>x[0]),datasets:[{data:tc.map(x=>x[1]),backgroundColor:COL,borderWidth:0}]},options:{...base,cutout:'55%',plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>' '+c.label+': '+inr(c.parsed)}}}}});
}

const hay=o=>[(o.payment||{}).ref,(o.customer||{}).name,(o.customer||{}).phone,(o.customer||{}).city,(o.payment||{}).utr,o.id].join(' ').toLowerCase();
function ordersView(){
 const v=$('view');
 if(ordState==='loading'){v.innerHTML='<p class="mut">Loading orders…</p>';return}
 if(ordState.startsWith('err')){v.innerHTML=`<div class="box"><h3>Could not load orders</h3><p>${esc(ordState.slice(4))}</p><div><button data-oref>Try again</button></div></div>`;return}
 const cn=s=>ORD.filter(o=>o.status===s).length;
 v.innerHTML=`<div class="tb"><input id="oq" placeholder="Search order ID, name, phone, UTR…" value="${esc(oq)}"><button data-oref>Refresh</button><button data-csv>Export CSV</button></div>
 <div class="chips">${['all',...ST].map(s=>`<button class="chip ${ofilter===s?'on':''}" data-of="${s}">${s==='all'?'All':STL[s]}<b>${s==='all'?ORD.length:cn(s)}</b></button>`).join('')}</div><div id="olist"></div>`;
 olist();
}
function olist(){
 const q=oq.trim().toLowerCase(),l=ORD.filter(o=>(ofilter==='all'||o.status===ofilter)&&(!q||hay(o).includes(q)));
 $('olist').innerHTML=l.length?l.map(ocard).join(''):'<p class="mut">No orders match.</p>';
}
function ocard(o){
 const c=o.customer||{},pm=o.payment||{},pt=parts(o),ph=String(c.phone||'').replace(/\D/g,''),wa=ph?'https://wa.me/'+(ph.length===10?'91'+ph:ph):'';
 const items=(o.items||[]).map(i=>{const q=+i.qty||0,u=+i.price||0,m=+i.mrp||0;return `<div class="l"><span>${esc(i.name)} × ${q}</span><span>${m>u?`<s>${inr(m*q)}</s> `:''}${inr(u*q)}</span></div>`}).join('');
 const shot=/^https:\/\/res\.cloudinary\.com\//.test(pm.screenshotUrl||'')?`<div class="shot"><a href="${esc(pm.screenshotUrl)}" target="_blank" rel="noopener" title="Open full size"><img alt="Payment screenshot" src="${esc(cld(pm.screenshotUrl,480))}"></a></div>`:pm.screenshotPath?`<p class="mut">Older order: screenshot is in Firebase Storage (${esc(pm.screenshotPath)}).</p>`:'<p class="mut">No payment screenshot.</p>';
 return `<details class="o" data-ok="${o.id}" ${openO.has(o.id)?'open':''}><summary><b>${esc(pm.ref||o.id.slice(0,8))}</b><span>${esc(c.name||'Customer')}</span><span class="amt">${inr(o.total)}</span><span class="pill ${esc(o.status)}">${esc(STL[o.status]||o.status)}</span><span class="mut">${fdate(o)}</span></summary>
 <div class="ob"><div><h4>Customer</h4><div>${esc(c.name||'')}</div>${c.phone?`<div><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>${wa?` · <a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div>`:''}<div>${esc([c.address,c.city,c.pincode].filter(Boolean).join(', '))}</div>${c.notes?`<div class="mut">Note: ${esc(c.notes)}</div>`:''}</div>
 <div><h4>Items</h4>${items}${pt.disc>0?`<div class="l g"><span>Discount</span><span>−${inr(pt.disc)}</span></div>`:''}${pt.gst>0?`<div class="l"><span>${pt.incl?'Includes GST':'GST'}</span><span>${pt.incl?'':'+'}${inr(pt.gst)}</span></div>`:''}<div class="l t"><span>Total paid</span><span>${inr(o.total)}</span></div></div>
 <div><h4>Payment</h4><span class="tag">UPI · ${inr(pm.amount??o.total)} to ${esc(pm.upiId||'')}</span>${pm.utr?`<div>UTR: <b>${esc(pm.utr)}</b></div>`:''}${o.pricing&&o.pricing.gstin?`<div class="mut">GSTIN ${esc(o.pricing.gstin)}</div>`:''}</div><div>${shot}</div>
 <div class="oc">${NX[o.status]?`<button class="pri big" data-ost="${o.id}|${NX[o.status][0]}">${NX[o.status][1]}</button>`:''}${o.status==='new'?`<button data-ost="${o.id}|cancelled">Reject</button>`:''}<select data-oid="${o.id}">${ST.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${STL[s]}</option>`).join('')}</select><button data-od="${o.id}">Delete order</button></div></div></details>`;
}
function exportCsv(){
 const q=oq.trim().toLowerCase(),l=ORD.filter(o=>(ofilter==='all'||o.status===ofilter)&&(!q||hay(o).includes(q)));
 const e=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 const rows=[['Order','Date','Status','Name','Phone','Address','City','Pincode','Items','Full price','Discount','GST','GST mode','Total','UTR']].concat(l.map(o=>{const c=o.customer||{},pm=o.payment||{},pt=parts(o);return [pm.ref||o.id,tms(o)?new Date(tms(o)).toISOString().slice(0,16).replace('T',' '):'',o.status,c.name,c.phone,c.address,c.city,c.pincode,(o.items||[]).map(i=>i.name+' x'+i.qty).join('; '),pt.mrp,pt.disc,pt.gst,pt.incl?'included':'added',o.total,pm.utr]}));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(e).join(',')).join('\n')],{type:'text/csv'}));a.download='cozelle-orders-'+dkey(new Date())+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

document.addEventListener('toggle',e=>{const t=e.target,k=t.dataset&&t.dataset.k,ok=t.dataset&&t.dataset.ok;if(k)t.open?open.add(k):open.delete(k);if(ok)t.open?openO.add(ok):openO.delete(ok)},true);
const dirty=()=>{isDirty=true;$('save').textContent='Save changes •'};
addEventListener('beforeunload',e=>{if(isDirty){e.preventDefault();e.returnValue=''}});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&!$('save').hidden){e.preventDefault();$('save').click();return}if(e.key==='Escape'&&productMode==='editor')closeProductEditor()});
document.addEventListener('click',async e=>{
 const c=e.target.closest.bind(e.target);let b;
 if(b=c('[data-tab]')){productMode='catalog';cur=b.dataset.tab;show();scrollTo(0,0);return}
 if(c('[data-out]')){if(!isDirty||confirm('You have unsaved changes. Sign out anyway?'))auth.signOut();return}
 if(c('[data-uid]')){try{await navigator.clipboard.writeText(auth.currentUser.uid);flash('UID copied')}catch(x){prompt('Your UID',auth.currentUser.uid)}return}
 if(b=c('[data-range]')){range=b.dataset.range;show();return}
 if(e.target.nodeType===1&&e.target.matches('[data-product-backdrop]')){closeProductEditor();return}
 if(c('[data-product-add]')){addP();return}
 if(c('[data-product-next]')){await $('save').onclick();if(!isDirty)addP();return}
 if(b=c('[data-pf]')){pf=b.dataset.pf;document.querySelectorAll('[data-pf]').forEach(x=>x.classList.toggle('on',x===b));pfilter();return}
 if(c('[data-golow]')){pf='low';productMode='catalog';cur='Products';show();scrollTo(0,0);return}
 if(b=c('[data-stk]')){const p=state.products.find(x=>x.id===b.dataset.stk),n=document.querySelector(`.stk-n[data-id="${p.id}"]`),card=n.closest('.catalog-product');p.stock=Math.max(0,(Stock.tracked(p)?Number(Stock.count(p)):0)+Number(b.dataset.d));n.textContent=p.stock;card.dataset.f=pst(p);card.querySelector('.catalog-product-meta').innerHTML=pmeta(p);dirty();return}
 if(b=c('[data-vis]')){const p=state.products.find(x=>x.id===b.dataset.vis);p.active=b.checked;const card=b.closest('.catalog-product');card.dataset.f=pst(p);card.querySelector('.catalog-product-meta').innerHTML=pmeta(p);dirty();return}
 if(b=c('[data-product-dup]')){const i=state.products.findIndex(x=>x.id===b.dataset.productDup),p=clone(state.products[i]);p.id='p-'+rid();p.name=(p.name||'Product')+' (copy)';state.products.splice(i+1,0,p);show();dirty();flash('Duplicated. Edit the copy, then Save.');return}
 if(b=c('[data-ost]')){const [id,st]=b.dataset.ost.split('|');if(st==='cancelled'&&!confirm('Reject this order? Stock is restored if it was already deducted.'))return;const sel=document.querySelector(`select[data-oid="${id}"]`);sel.value=st;sel.dispatchEvent(new Event('change',{bubbles:true}));return}
 if(b=c('[data-product-select]')){selectedProductId=b.dataset.productSelect;productMode='editor';show();$('productWorkspace')?.focus({preventScroll:true});return}
 if(c('[data-product-back]')){closeProductEditor();return}
 if(c('[data-product-save]')){$('save').click();return}
 if(c('[data-oref]')){flash('Refreshing…');await loadOrders();show();return}
 if(b=c('[data-of]')){ofilter=b.dataset.of;ordersView();return}
 if(b=c('[data-gofilter]')){ofilter=b.dataset.gofilter;oq='';cur='Orders';show();scrollTo(0,0);return}
 if(b=c('[data-goto]')){const o=ORD.find(x=>x.id===b.dataset.goto);cur='Orders';ofilter='all';oq=o?(o.payment||{}).ref||'':'';if(o)openO.add(o.id);show();scrollTo(0,0);return}
 if(c('[data-csv]')){exportCsv();return}
 if(b=c('[data-od]')){if(confirm('Delete this order for good? Its payment screenshot stays in your Cloudinary Media Library.')){try{await db.collection('orders').doc(b.dataset.od).delete();ORD=ORD.filter(o=>o.id!==b.dataset.od);flash('Order deleted');show()}catch(err){flash('Could not delete: '+err.message,1)}}return}
 if(b=c('[data-sale]')){
  const cat=$('saleCat').value,pct=Number($('salePct').value),clear=b.dataset.sale==='clear';
  if(!clear&&!(pct>=1&&pct<=95)){flash('Enter a discount between 1 and 95.',1);return}
  const l=(state.products||[]).filter(p=>!cat||p.category===cat);if(!l.length){flash('No products in that category.',1);return}
  l.forEach(p=>p.discount=clear?0:pct);dirty();show();flash((clear?'Discount removed from ':pct+'% off set on ')+l.length+' product'+(l.length>1?'s':'')+'. Press Save changes to publish.');return}
 b=c('[data-a]');if(!b)return;e.preventDefault();
 const {a,p,i}=b.dataset;let arr=getp(state,p);if(!arr){arr=[];setp(state,p,arr)}
 if(a==='add'){const n=NEWS[p.replace(/\.\d+/g,'')];arr.push(n?n():{});open.add(p+'.'+(arr.length-1))}
 else{const j=+i;if(a==='del'){if(!confirm('Delete this item?'))return;arr.splice(j,1);open.clear()}
  else{const k=a==='up'?j-1:j+1;if(k<0||k>=arr.length)return;[arr[j],arr[k]]=[arr[k],arr[j]];open.clear()}}
 show();dirty();
});
document.addEventListener('input',e=>{
 const t=e.target,p=t.dataset.p;
 if(t.id==='oq'){oq=t.value;olist();return}
 if(t.id==='psearch'){pfilter();return}
 if(!p)return;
 const ty=t.dataset.t,v=ty===B?t.checked:ty===N?(t.value===''?0:Number(t.value)):ty===W||ty===O?(t.value===''?undefined:Number(t.value)):t.value;
 v===undefined?delp(state,p):setp(state,p,v);
 if(ty===I)t.closest('.img').querySelector('img').src=cld(v,120);
 const d=t.closest('details.it');
 if(d){if(p.endsWith('.'+d.dataset.ik)){const sn=d.querySelector('.sn');if(sn)sn.textContent=t.value||'Untitled'}
  if(d.dataset.k.startsWith('products.')){const it=getp(state,d.dataset.k),sm=d.querySelector('.sm');if(sm)sm.innerHTML=prodMeta(it);d.dataset.s=((it.name||'')+' '+(it.category||'')).toLowerCase()}}
 const pm=p.match(/^products\.(\d+)\./);if(pm){const it=state.products[Number(pm[1])],title=$('productEditorName'),name=$('productPreviewName'),cat=$('productPreviewCategory'),price=$('productPreviewPrice'),photo=$('productPreviewPhoto'),stock=$('productPreviewStock'),topStock=$('productEditorStock');if(title&&selectedProductId===it.id)title.textContent=it.name||'Untitled';if(name)name.textContent=it.name||'Untitled';if(cat)cat.textContent=it.category||'Product preview';if(price)price.innerHTML=Price.html(it);if(photo)photo.src=cld(it.image,360);if(stock)stock.textContent=Stock.tracked(it)?Stock.label(it):'Stock not set';if(topStock)topStock.textContent=Stock.tracked(it)?Stock.label(it):'Stock not set'}
 dirty();
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.oid){const o=ORD.find(x=>x.id===t.dataset.oid);
  try{const changes=await changeOrderStatus(t.dataset.oid,t.value);if(o){o.status=t.value;if(SALE(t.value))o.stockDeducted=true;if(t.value==='cancelled'&&o.stockDeducted)o.stockDeducted=false}flash(Object.keys(changes).length?'Order updated':'Order updated');ordersView();nav()}
  catch(err){flash('Could not update: '+err.message,1);ordersView()}return}
 if(!t.dataset.up||!t.files[0])return;
 const f=t.files[0];
 if(!/^image\//.test(f.type)){flash('Please choose an image file.',1);return}
 if(f.size>10*1024*1024){flash('That image is over 10 MB. Please choose a smaller one.',1);return}
 flash('Uploading…');
 try{const url=(await cldUpload(f,{preset:CLOUDINARY.sitePreset,tags:['site']})).secure_url;
  setp(state,t.dataset.up,url);const bx=t.closest('.img');bx.querySelector('input[data-p]').value=url;bx.querySelector('img').src=cld(url,120);
  const d=t.closest('details.it');if(d&&d.dataset.k.startsWith('products.')){const th=d.querySelector('.th');if(th)th.src=cld(url,80)}
  const match=t.dataset.up.match(/^products\.(\d+)\.image$/);if(match){const p=state.products[Number(match[1])],preview=$('productPreviewPhoto');if(preview&&selectedProductId===p.id)preview.src=cld(url,360)}
  dirty();flash('Uploaded')}
 catch(err){flash('Upload failed: '+err.message,1)}
 t.value='';
});

document.addEventListener('focusin',e=>{if(e.target.type==='number')e.target.select()});

function validate(){
 const ps=state.products||[],s=state.site||{};
 for(let i=0;i<ps.length;i++){const p=ps[i],bad=(m,key='name')=>{cur='Products';selectedProductId=p.id;productMode='editor';show();requestAnimationFrame(()=>{scrollTo(0,0);document.querySelector(`[data-p="products.${i}.${key}"]`)?.focus()});flash((p.name||'Product '+(i+1))+': '+m,1);return false};
  if(!String(p.name||'').trim())return bad('please enter a name.');
  if(!(p.price>=0))return bad('price must be 0 or more.','price');
  if(p.discount!==undefined&&!(p.discount>=0&&p.discount<=95))return bad('discount must be between 0 and 95.','discount');
  if(p.stock!==undefined&&(!Number.isInteger(Number(p.stock))||Number(p.stock)<0))return bad('stock must be a whole number of 0 or more.','stock');
  if(p.gst!==undefined&&!(p.gst>=0&&p.gst<=100))return bad('GST must be between 0 and 100.','gst')}
 const u=String(s.upiId||'').trim(),sb=m=>{cur='Settings';show();flash(m,1);return false};
 if(u&&!/^[a-zA-Z0-9._-]{2,256}@[a-zA-Z][a-zA-Z0-9.-]{1,63}$/.test(u))return sb('That UPI ID does not look right (it should look like name@bank).');
 if(!(s.gstPct>=0&&s.gstPct<=100))return sb('Default GST % must be between 0 and 100.');
 return true;
}
$('save').onclick=async()=>{
 if(!validate())return;
 const btn=$('save');btn.disabled=true;
 try{state.products.forEach((p,i)=>{if(!p.id)p.id='p-'+rid();p.order=i+1});
  const {products=[],...site}=state;
  const b=db.batch();b.set(db.doc('site/main'),site);
  products.forEach(p=>b.set(db.collection('products').doc(p.id),p));
  oldIds.filter(id=>!products.some(p=>p.id===id)).forEach(id=>b.delete(db.collection('products').doc(id)));
  await b.commit();oldIds=products.map(p=>p.id);isDirty=false;btn.textContent='Save changes';flash('Saved');
 }catch(err){flash(err.code==='permission-denied'?'Not allowed: paste your UID (Copy my UID, bottom-left) into firebase/firestore.rules and publish it.':'Save failed: '+err.message,1)}
 btn.disabled=false;
};
$('lf').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';
 try{await auth.signInWithEmailAndPassword($('em').value,$('pw').value)}catch(err){$('lerr').textContent=err.message}};

auth.onAuthStateChanged(async u=>{
 const cust=u&&u.email&&u.email.toLowerCase().endsWith('@'+CUSTOMER_DOMAIN);
 if(cust){$('login').hidden=false;$('app').hidden=true;$('lerr').textContent='This browser is signed in as a shop customer. Sign in with your admin email below.';return}
 $('login').hidden=!!u;$('app').hidden=!u;
 if(!u){ORD=[];ordState='loading';return}
 try{const [s,p]=await Promise.all([db.doc('site/main').get(),db.collection('products').get()]);
  state=deepMerge(clone(DEFAULT_DATA),s.exists?s.data():{});fixAssets(state);
  state.products=(s.exists?p.docs.map(d=>({id:d.id,...d.data()})):clone(DEFAULT_DATA.products)).sort((x,y)=>(x.order??0)-(y.order??0));fixAssets(state);
  oldIds=p.docs.map(d=>d.id);
  if(!s.exists)flash('Nothing saved yet. Showing starter content. Press Save to publish it.');
 }catch(err){state=clone(DEFAULT_DATA);flash('Could not read Firestore: '+err.message,1)}
 cur='Dashboard';show();
 await loadOrders();
 if(cur==='Dashboard'||cur==='Orders')show();else nav();
});
