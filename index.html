<link rel="preload" as="style" href="assets/css/panels.css?v=0b43caca" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="assets/css/panels.css?v=0b43caca"></noscript>
</head>
<body class="lock">
<noscript><h1>Cozelle - Wrapped in comfort</h1><p>Merino and wool yarn, cable-knit throws, plaited wool rugs and knitwear, finished by hand. Free delivery across India and 7-day easy returns.</p><nav><a href="/">Home</a> <a href="/collection">Collection</a> <a href="/about">About</a> <a href="/contact">Contact</a></nav></noscript>

<div class="loader" id="loader" aria-hidden="true">
  <div><img class="l1" src="assets/img/cozelle-logo-full.webp?v=b6510503" width="600" height="342" fetchpriority="high" alt="Cozelle - Wrapped in comfort"><img class="l2" src="assets/img/cozelle-divider.webp?v=017d788f" width="460" height="40" alt=""></div>
</div>

<div class="page">
  <header>
    <a class="brand" href="#top" data-aria="site.name"><img class="bm" src="assets/img/cozelle-logo.webp?v=14ba9751" width="112" height="104" alt=""><img class="bw" src="assets/img/cozelle-wordmark.webp?v=efac085f" width="360" height="101" alt="Cozelle - Wrapped in comfort"></a>
    <div class="hline" aria-hidden="true"></div>
    <div class="hctl"><button class="bag" id="bag" data-aria="ui.openBag"><span class="bi"></span><b id="count">0</b></button>
    <button class="burger" id="burger" data-aria="ui.openMenu"><i></i><i></i><i></i></button></div>
  </header>

  <div class="hero" id="top">
    <div class="left">
      <div class="intro">
        <div class="eyebrow" data-text="hero.eyebrow"></div>
        <h1><span data-text="hero.title"></span><em data-text="hero.accent"></em></h1>
        <p class="lead" data-text="hero.lead"></p>
      </div>
      <div class="heroprods" id="heroProds"></div>
    </div>
    <div class="right">
      <div class="model ph"><img data-src="hero.modelImage" data-w="1200" data-alt="hero.modelAlt" data-sizes="(max-width:900px) 100vw, 50vw" fetchpriority="high" decoding="async" alt=""></div>
      <div class="reviews" id="reviews"></div>
    </div>
  </div>

  <section id="shop">
    <div class="sec-head"><h2><span data-text="collection.title"></span> <em data-text="collection.accent"></em></h2></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="story"><div class="story" id="storyList"></div></section>

  <footer id="contact">
    <div class="fgrid">
      <div><img class="flogo" src="assets/img/cozelle-wordmark-light.webp?v=a3d79fa7" width="480" height="135" alt="Cozelle - Wrapped in comfort">
        <p data-text="footer.blurb"></p>
        <form id="nl"><input type="email" required data-ph="ui.emailPh" data-aria="ui.emailPh"><button data-text="ui.join"></button></form></div>
      <div class="dc" id="fcols"></div>
    </div>
    <div class="copy" data-text="site.copyright"></div>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="menu" role="dialog" aria-modal="true" data-aria="ui.menuTitle">
  <div class="ph-head"><h2 data-text="ui.menuTitle"></h2><button class="x" data-close data-aria="ui.closeMenu">×</button></div>
  <nav id="menuNav"></nav>
  <p><img class="mlogo" src="assets/img/cozelle-wordmark.webp?v=efac085f" width="360" height="101" alt="Cozelle - Wrapped in comfort"></p>
</aside>
<aside class="panel empty" id="drawer" role="dialog" aria-modal="true" data-aria="ui.bagTitle">
  <div class="ph-head"><h2 class="t-bag" data-text="ui.bagTitle"></h2><h2 class="t-det" data-text="checkout.title"></h2><button class="x" data-close data-aria="ui.closeBag">×</button></div>
  <ul id="cartList"></ul>
  <div class="emp"><p data-text="ui.empty"></p><button class="co" id="shopBtn" data-text="ui.browse"></button></div>
  <div class="df"><div class="brk" id="brk"></div><div class="sum"><span data-text="tax.total"></span><strong id="subtotal">0</strong></div><small data-text="ui.delivery"></small><button class="co" id="checkout" data-text="pay.proceed"></button></div>
  <form class="cof" id="coForm">
    <div class="cof-sum"><span data-text="ui.total"></span><strong id="coTotal"></strong></div>
    <div class="cof-grid" id="coFields"></div>
    <button class="co" type="submit" data-text="pay.continue"></button>
    <button class="cof-back" type="button" id="coBack" data-text="checkout.back"></button>
  </form>
</aside>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/js/cloudinary.min.js?v=82855774"></script>
<script src="assets/js/media.min.js?v=868111d4"></script>
<script src="assets/js/cozelle-data.min.js?v=b82b77f4"></script>
<script src="assets/js/seo.min.js?v=f7174882"></script>
<script>
let db=null;try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){console.warn('Firebase unavailable, using built-in content',e)}
async function loadData(){
 if(!db)return DEFAULT_DATA;
 const [s,p]=await Promise.all([db.doc('site/main').get(),db.collection('products').get()]);
 if(!s.exists)return DEFAULT_DATA;
 return fixAssets({...deepMerge(DEFAULT_DATA,s.data()),products:p.docs.map(d=>({id:d.id,...d.data()}))});
}

const $=id=>document.getElementById(id),root=document.documentElement,B=document.body;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
let D=DEFAULT_DATA,cart={};
try{cart=JSON.parse(localStorage.getItem('cozelle-cart'))||{}}catch(e){}
const live=()=>(D.products||[]).filter(p=>p.active!==false).sort((a,b)=>(a.order??0)-(b.order??0));
const money=n=>(D.site.currency||'')+Number(n).toLocaleString(D.site.locale||'en-IN');
const href=h=>{h=cleanUrl(h);return h==='wa'?'https://wa.me/'+D.site.whatsapp:h};
const drawer=$('drawer'),list=$('cartList'),count=$('count'),sub=$('subtotal'),bag=$('bag'),tEl=$('toast');
let tt;function toast(m,viewBag=false){tEl.replaceChildren();const text=document.createElement('span');text.textContent=m;tEl.append(text);tEl.classList.toggle('has-action',viewBag);if(viewBag){const action=document.createElement('button');action.type='button';action.className='toast-action';action.textContent='View bag';action.setAttribute('aria-label','View your bag');action.onclick=()=>{clearTimeout(tt);tEl.classList.remove('show');bag.click()};tEl.append(action)}tEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>tEl.classList.remove('show'),viewBag?4500:2200)}

const BIND={text:0,src:'src',alt:'alt',ph:'placeholder',aria:'aria-label'};
function bind(){for(const k in BIND)document.querySelectorAll(`[data-${k}]`).forEach(e=>{
 const v=get(D,e.getAttribute('data-'+k));if(v==null)return;
 if(k==='text')e.textContent=v;else{if(k==='src'&&e.dataset.sizes&&isCld(v)){e.sizes=e.dataset.sizes;e.srcset=cldSet(v,[480,800,1200])}e.setAttribute(BIND[k],k==='src'?cld(v,+e.dataset.w||0):v);if(k==='src')e.style.display=''}})}

const card=(p,full)=>`<article class="${full?'card':'hp'} rise"><div class="pic"><div class="im ph">${cldMedia(p.image,900,p.name,'',{eager:!full})}<img class="bl" loading="lazy" src="${esc(cld(p.image,200))}" alt="" aria-hidden="true"></div><a class="plink" href="product?id=${encodeURIComponent(p.id)}" aria-label="${esc(p.name)}"></a><div class="info"><h3>${esc(p.name)}</h3>${full&&p.category?`<p>${esc(p.category)}</p>`:''}<div class="price">${Price.html(p)}</div></div><button class="arch" data-add="${esc(p.id)}" ${Stock.tracked(p)&&Stock.count(p)===0?'disabled':''}>${esc(D.ui.addToBag)}</button></div></article>`;

let cur=0,rt;
function renderReviews(){
 const rs=D.reviews||[],rv=$('reviews');rv.hidden=!rs.length;
 rv.innerHTML=rs.map((r,k)=>`<div class="rv${k?'':' on'}"><div class="av">${esc((r.name||'?')[0])}</div><div class="top"><span>${esc(r.name)}</span><span class="stars">${'★'.repeat(r.rating??5)}</span></div><p>${esc(r.text)}</p></div>`).join('');
 cur=0;clearInterval(rt);
 if(rs.length>1)rt=setInterval(()=>{const s=rv.children;s[cur].classList.remove('on');cur=(cur+1)%s.length;s[cur].classList.add('on')},4200);
}

const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});
const observe=()=>document.querySelectorAll('.rise:not(.in)').forEach((el,k)=>{el.style.transitionDelay=(k%3)*.12+'s';io.observe(el)});

function render(data){
 D=data;const {site}=D;
 Object.entries(D.theme||{}).forEach(([k,v])=>root.style.setProperty('--'+k,v));
 root.style.setProperty('--bg-image',site.background?`url("${cld(site.background,1920,{eco:1})}")`:'none');
 document.title=site.title||site.name;Seo.page(D,'home');
 bind();
 const ps=live(),rest=ps.filter(p=>!p.featured);
 $('heroProds').innerHTML=ps.filter(p=>p.featured).map(p=>card(p,false)).join('');
 $('grid').innerHTML=rest.map(p=>card(p,true)).join('');
 $('shop').hidden=!rest.length;
 const st=D.story||[];$('story').hidden=!st.length;
 $('storyList').style.setProperty('--scols',Math.max(st.length,1));
 $('storyList').innerHTML=st.map(s=>`<div class="rise"><h4>${esc(s.title)}</h4><p>${esc(s.text)}</p></div>`).join('');
 const cols=D.footer.columns||[];$('contact').style.setProperty('--fcols',Math.max(cols.length,1));
 $('fcols').innerHTML=cols.map(c=>`<div><h5>${esc(c.title)}</h5><ul>${(c.items||[]).map(i=>i.href?`<li><a href="${esc(href(i.href))}">${esc(i.label)}</a></li>`:`<li>${esc(i.label)}</li>`).join('')}</ul></div>`).join('');
 $('menuNav').innerHTML=(D.menu.links||[]).map(l=>{const h=cleanUrl(l.href)==='/'?'#top':href(l.href);return `<a href="${esc(h)}">${esc(l.label)}</a>`}).join('');
 renderReviews();
 Object.keys(cart).forEach(k=>{const p=ps.find(x=>x.id===k);if(!p||!(cart[k]>0)||Stock.tracked(p)&&Stock.count(p)===0)delete cart[k];else if(Stock.tracked(p))cart[k]=Math.min(cart[k],Stock.count(p))});
 renderFields();renderCart();observe();
}

function renderCart(){
 const u=D.ui,rows=live().filter(p=>cart[p.id]),q=rows.reduce((s,p)=>s+cart[p.id],0);
 count.textContent=q;{const c=Price.calc(rows,cart),bk=document.getElementById('brk');sub.textContent=Price.money(c.total);if(bk)bk.innerHTML=Price.brk(c)};drawer.classList.toggle('empty',!q);
 list.innerHTML=rows.map(p=>`<li class="ci"><div class="th ph"><img src="${esc(cld(p.image,160))}" alt=""></div><div><h5>${esc(p.name)}</h5><div class="price">${Price.html(p)}</div>${Stock.tracked(p)?`<div class="stock${Stock.count(p)===0?' out':''}">${esc(Stock.label(p))}</div>`:''}<div class="qty"><button data-k="${esc(p.id)}" data-q="-1" aria-label="${esc(u.decrease)}">−</button><span>${cart[p.id]}</span><button data-k="${esc(p.id)}" data-q="1" aria-label="${esc(u.increase)}" ${Stock.tracked(p)&&cart[p.id]>=Stock.count(p)?'disabled':''}>+</button></div></div><button class="rm" data-rm="${esc(p.id)}" aria-label="${esc(u.remove+' '+p.name)}">×</button></li>`).join('');
 try{localStorage.setItem('cozelle-cart',JSON.stringify(cart))}catch(e){}
}
let cust={};try{cust=JSON.parse(localStorage.getItem('cozelle-customer'))||{}}catch(e){}
function renderFields(){
 $('coFields').innerHTML=(D.checkout.fields||[]).map(f=>{
  const v=esc(cust[f.key]||''),a=`name="${esc(f.key)}" placeholder="${esc(f.placeholder||' ')}"${f.required?' required':''}${f.autocomplete?` autocomplete="${esc(f.autocomplete)}"`:''}`;
  const input=f.type==='textarea'?`<textarea ${a}>${v}</textarea>`:`<input type="${esc(f.type||'text')}" value="${v}" ${a}${f.pattern?` pattern="${esc(f.pattern)}"`:''}${f.hint?` title="${esc(f.hint)}"`:''}>`;
  return `<label class="${f.half?'half':''}"><span>${esc(f.label)}</span>${input}</label>`}).join('');
}
function setQty(k,d){const p=live().find(x=>x.id===k);if(!p)return;const next=(cart[k]||0)+d;if(Stock.tracked(p)&&next>Stock.count(p)){toast(`Only ${Stock.count(p)} in stock`);return}cart[k]=next;if(cart[k]<=0)delete cart[k];renderCart()}
const close=()=>{B.classList.remove('menu-open','cart-open');drawer.classList.remove('details')};
document.addEventListener('click',e=>{
 let b=e.target.closest('[data-add]');
 if(b){const p=live().find(x=>x.id===b.dataset.add);setQty(b.dataset.add,1);bag.classList.remove('bump');void bag.offsetWidth;bag.classList.add('bump');toast(p.name+' '+D.ui.added,true);return}
 if(b=e.target.closest('[data-k]')){setQty(b.dataset.k,+b.dataset.q);return}
 if(b=e.target.closest('[data-rm]')){delete cart[b.dataset.rm];renderCart();return}
 if(e.target.closest('[data-close]')||e.target.id==='scrim'||e.target.closest('#menu nav a'))close();
});
bag.onclick=()=>{close();B.classList.add('cart-open')};
$('burger').onclick=()=>{close();B.classList.add('menu-open')};
$('shopBtn').onclick=()=>{close();$('shop').scrollIntoView()};
$('nl').onsubmit=e=>{e.preventDefault();toast(D.ui.thanks);e.target.reset()};
$('checkout').onclick=()=>{if(!live().some(p=>cart[p.id]))return;$('coTotal').textContent=sub.textContent;drawer.classList.add('details');const f=$('coFields').querySelector('input,textarea');if(f&&!f.value)setTimeout(()=>f.focus(),450)};
$('coBack').onclick=()=>drawer.classList.remove('details');
$('coForm').addEventListener('input',e=>{if(!e.target.name)return;cust[e.target.name]=e.target.value;try{localStorage.setItem('cozelle-customer',JSON.stringify(cust))}catch(_){}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.style.display='none'},true);

const loader=$('loader');let seen=false;
try{seen=sessionStorage.getItem('cozelle-seen')==='1';sessionStorage.setItem('cozelle-seen','1')}catch(e){}
function start(){loader.classList.add('done');B.classList.remove('lock');B.classList.add('ready')}
const t0=Date.now(),dataReady=loadData().catch(e=>{console.error('loadData failed, using defaults',e);return DEFAULT_DATA}).then(render);
const loaded=document.readyState==='complete'?Promise.resolve():new Promise(r=>addEventListener('load',r));
if(seen)dataReady.then(start);else Promise.all([dataReady,loaded]).then(()=>setTimeout(start,Math.max(0,2300-(Date.now()-t0))));
setTimeout(start,5000);
window.Cozelle={render,get data(){return D}};
</script>
<script src="assets/js/account.min.js?v=e12b3229"></script>
<script src="assets/js/checkout.min.js?v=3ee03cb9"></script>
<script src="assets/js/cookies.min.js?v=b7a808b1"></script>
</body>
